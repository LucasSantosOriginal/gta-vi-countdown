<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Countdown to the release of Grand Theft Auto VI.">

    <title>GTA VI Countdown</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
</head>

<body>

    <main>

        <h1>Grand Theft Auto VI</h1>

        <p class="release-date">
            November 19, 2026
        </p>


        <section class="countdown">

            <div class="time-box">

                <span id="days">
                    00
                </span>

                <small id="days-label">
                    DAYS
                </small>

            </div>


            <div class="time-box">

                <span id="hours">
                    00
                </span>

                <small id="hours-label">
                    HOURS
                </small>

            </div>


            <div class="time-box">

                <span id="minutes">
                    00
                </span>

                <small id="minutes-label">
                    MINUTES
                </small>

            </div>


            <div class="time-box">

                <span id="seconds">
                    00
                </span>

                <small id="seconds-label">
                    SECONDS
                </small>

            </div>

        </section>

    </main>


    <footer>

        <p>

            Designed & developed by

            <a href="https://github.com/LucasSantosOriginal" target="_blank" rel="noopener noreferrer">
                Lucas Santos
            </a>

        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
